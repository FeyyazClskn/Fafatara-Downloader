name: Fafatara Downloader Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==================================================
  # WINDOWS
  # ==================================================

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Python 3.11 kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64

      - name: Python paketlerini yükle
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # ==================================================
      # WINDOWS ARAÇLARI KONTROL
      # ==================================================

      - name: Windows araçlarını kontrol et
        shell: pwsh
        run: |
          if (-not (Test-Path "tools\windows\deno.exe")) {
            Write-Error "tools\windows\deno.exe bulunamadı."
            exit 1
          }

          if (-not (Test-Path "tools\windows\ffmpeg.exe")) {
            Write-Error "tools\windows\ffmpeg.exe bulunamadı."
            exit 1
          }

          $denoSize = (Get-Item "tools\windows\deno.exe").Length
          $ffmpegSize = (Get-Item "tools\windows\ffmpeg.exe").Length

          Write-Host "Deno boyutu: $denoSize bytes"
          Write-Host "FFmpeg boyutu: $ffmpegSize bytes"

          if ($denoSize -lt 1000000) {
            Write-Error "Deno gerçek binary olarak indirilmemiş görünüyor."
            exit 1
          }

          if ($ffmpegSize -lt 100000) {
            Write-Error "FFmpeg gerçek binary olarak bulunamadı."
            exit 1
          }

      # ==================================================
      # BGUTIL SERVER
      # ==================================================

      - name: bgutil server bağımlılıklarını kur
        shell: pwsh
        working-directory: tools/bgutil/bgutil-ytdlp-pot-provider/server
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\deno.exe" install

      # ==================================================
      # WINDOWS PYINSTALLER
      # ==================================================

      - name: Windows uygulamasını oluştur
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onedir ^
            --name "Fafatara Downloader" ^
            --icon "assets\logo.ico" ^
            --add-binary "tools\windows\deno.exe;tools\windows" ^
            --add-binary "tools\windows\ffmpeg.exe;tools\windows" ^
            --add-data "assets;assets" ^
            --add-data "tools\bgutil;tools\bgutil" ^
            --collect-all yt_dlp ^
            --collect-all yt_dlp_ejs ^
            --collect-all yt_dlp_plugins ^
            main.py

      # ==================================================
      # WINDOWS BUILD KONTROLÜ
      # ==================================================

      - name: Windows build kontrolü
        shell: pwsh
        run: |
          $root = "dist\Fafatara Downloader"
          $app = "$root\Fafatara Downloader.exe"

          if (-not (Test-Path $app)) {
            Write-Error "Fafatara Downloader.exe oluşturulamadı."
            exit 1
          }

          if (-not (Test-Path "$root\_internal\tools\windows\deno.exe")) {
            Write-Error "Paket içinde deno.exe bulunamadı."
            exit 1
          }

          if (-not (Test-Path "$root\_internal\tools\windows\ffmpeg.exe")) {
            Write-Error "Paket içinde ffmpeg.exe bulunamadı."
            exit 1
          }

          if (-not (Test-Path "$root\_internal\tools\bgutil\bgutil-ytdlp-pot-provider\server\src\main.ts")) {
            Write-Error "Paket içinde bgutil server bulunamadı."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS BUILD BAŞARILI"
          Write-Host "========================================"
          Write-Host "EXE: $app"
          Write-Host "Deno: OK"
          Write-Host "FFmpeg: OK"
          Write-Host "bgutil: OK"
          Write-Host "========================================"

      # ==================================================
      # WINDOWS ZIP
      # ==================================================

      - name: Windows ZIP oluştur
        shell: pwsh
        run: |
          if (Test-Path "Fafatara-Downloader-Windows-x64.zip") {
            Remove-Item "Fafatara-Downloader-Windows-x64.zip" -Force
          }

          Compress-Archive `
            -Path "dist\Fafatara Downloader" `
            -DestinationPath "Fafatara-Downloader-Windows-x64.zip"

      - name: Windows paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: Fafatara-Downloader-Windows-x64
          path: Fafatara-Downloader-Windows-x64.zip
          if-no-files-found: error


  # ==================================================
  # LINUX
  # ==================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Python 3.11 kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64

      - name: Linux sistem paketlerini yükle
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-dev \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Python paketlerini yükle
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Linux uygulamasını oluştur
        shell: bash
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Linux ZIP oluştur
        shell: bash
        run: |
          tar -czf \
            Fafatara-Downloader-Linux-x64.tar.gz \
            -C dist \
            "Fafatara Downloader"

      - name: Linux paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: Fafatara-Downloader-Linux-x64
          path: Fafatara-Downloader-Linux-x64.tar.gz
          if-no-files-found: error